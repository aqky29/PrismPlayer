[package]
name = "fluf_native"
version = "0.1.0"
edition = "2021"

[lib]
name = "fluf_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
memchr = "2"
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
