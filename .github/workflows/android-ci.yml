name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Rust Core, Unit Tests, Lint & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust toolchain (aarch64-linux-android)
        if: hashFiles('rust-core/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust dependencies and target
        if: hashFiles('rust-core/Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core

      - name: Configure Android NDK for Rust cross-compilation
        if: hashFiles('rust-core/Cargo.toml') != ''
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          NDK_DIR="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"

          if [[ -z "$NDK_DIR" || ! -d "$NDK_DIR" ]]; then
            NDK_DIR="$(find "$SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1 || true)"
          fi

          if [[ -z "$NDK_DIR" || ! -d "$NDK_DIR" ]]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" --install "ndk;27.2.12479018"
            NDK_DIR="$SDK_ROOT/ndk/27.2.12479018"
          fi

          TOOLCHAIN_BIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [[ ! -x "$TOOLCHAIN_BIN/aarch64-linux-android26-clang" ]]; then
            echo "NDK clang not found at $TOOLCHAIN_BIN" >&2
            exit 1
          fi

          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN_BIN/aarch64-linux-android26-clang"
            echo "CC_aarch64_linux_android=$TOOLCHAIN_BIN/aarch64-linux-android26-clang"
            echo "CXX_aarch64_linux_android=$TOOLCHAIN_BIN/aarch64-linux-android26-clang++"
            echo "AR_aarch64_linux_android=$TOOLCHAIN_BIN/llvm-ar"
          } >> "$GITHUB_ENV"

      - name: Run Rust unit tests
        if: hashFiles('rust-core/Cargo.toml') != ''
        working-directory: rust-core
        run: cargo test --locked

      - name: Build Rust native library (arm64-v8a)
        if: hashFiles('rust-core/Cargo.toml') != ''
        working-directory: rust-core
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/rust-core/target
        run: bash ./build-android.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM unit tests, lint, and build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug*
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: prismplayer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
